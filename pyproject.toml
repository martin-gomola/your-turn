[project]
name = "your-turn"
version = "0.7.0"
description = "An inbox for your coding agents. See which chat is waiting on you, what each one produced, and what to do next."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    "segno>=1.6.6",
    "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://github.com/martin-gomola/your-turn"

[project.scripts]
yourturn = "yourturn.cli:main"
your-turn = "yourturn.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "plugin", "scripts", "tests", "docs/agents-snippet.md", "docs/configuration.md", "config.toml", "uv.lock", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/yourturn"]

# The handoff skill, which `your-turn install` copies to Claude Code and Cursor.
[tool.hatch.build.targets.wheel.force-include]
"plugin" = "yourturn/plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
