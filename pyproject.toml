[project]
name = "your-turn"
version = "0.1.0"
description = "An inbox for your coding agents. See which chat is waiting on you, what each one produced, and what to do next."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
yourturn = "yourturn.cli:main"
your-turn = "yourturn.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yourturn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
